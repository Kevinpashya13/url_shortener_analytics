services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npx prisma migrate deploy && npm start"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/url_shortener"
      REDIS_URL: "redis://redis:6379"
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-5173}"
      JWT_SECRET: "0d868a1cb3ad05d332addce47efc2721a16b29051110a7f7b8fc3b43a19187975571504812ce922ebe66a61274c395cfe7d71577e55d8e5cb5481cbc51d936e1"
      JWT_EXPIRES_IN: "7d"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:${BACKEND_PORT:-3000}"
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata: